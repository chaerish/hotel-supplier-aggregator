services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: aggregator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-supplier:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: mock
    ports:
      - "9191:9191"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mock-supplier:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aggregator
      DB_USERNAME: aggregator
      DB_PASSWORD: aggregator
    ports:
      - "8080:8080"
